name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Import check
        working-directory: backend
        run: python -c "import app.main"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build

  docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `docker compose build` validates the full service config (including
      # `volumes:` interpolation) even though build itself never uses these
      # values - only `up` does. Dummy values are enough to pass validation.
      - name: Write dummy .env for build validation
        run: |
          echo "PYTRACE_HOST_DATA_DIR=/tmp/pytrace-data" >> .env
          echo "GEMINI_API_KEY=dummy" >> .env
          echo "GITHUB_TOKEN_KEY=dummy" >> .env
      - name: Build all images
        run: docker compose build
